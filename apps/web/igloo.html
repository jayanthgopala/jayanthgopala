<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Igloo</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e8edf6;
        --ground: #0a0c11;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--ground);
        color: var(--ink);
        font: 400 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* A very slight lift behind the dome. It reads as depth rather than as a
         gradient because nothing else in the frame is lit from that direction. */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: radial-gradient(58% 46% at 50% 42%, #161b25 0%, #0a0c11 72%);
        z-index: 0;
      }

      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 1;
        /* The pointer belongs to the igloo, so the browser must not claim it
           for panning or double-tap zoom on touch. */
        touch-action: none;
      }

      #overlay {
        position: fixed;
        inset: 0;
        z-index: 3;
        display: grid;
        place-items: center;
        background: var(--ground);
        color: #7d8798;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-size: 10px;
        transition: opacity 700ms ease;
      }
      #overlay.gone { opacity: 0; pointer-events: none; }
      #overlay.error {
        color: #ff9a9a;
        letter-spacing: 0;
        text-transform: none;
        font-size: 13px;
        padding: 24px;
        text-align: center;
      }

      #hint {
        position: fixed;
        left: 50%;
        bottom: max(28px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 2;
        color: #6d7789;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 10px;
        opacity: 0;
        transition: opacity 900ms ease;
        pointer-events: none;
        white-space: nowrap;
      }
      #hint.show { opacity: 1; }

      @media (prefers-reduced-motion: reduce) {
        #overlay, #hint { transition: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="overlay">Loading</div>
    <p id="hint">Hover the blocks &nbsp;·&nbsp; click to knock one out</p>
    <script type="module" src="/src/igloo/main.js"></script>
  </body>
</html>
