<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#08080A" />

    <title>Jayanth Gopala V — Software Engineer</title>
    <meta
      name="description"
      content="Building scalable software and exceptional digital experiences."
    />

    <!--
      These values are placeholders. functions/_middleware.js rewrites them at
      the edge from live content, so link previews follow the admin panel.
      HTMLRewriter can only fill tags that already exist — every tag the
      middleware targets must be present here, even if empty.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jayanth Gopala V — Software Engineer" />
    <meta
      property="og:description"
      content="Building scalable software and exceptional digital experiences."
    />
    <meta property="og:url" content="https://jayanthgopala.com/" />
    <meta property="og:image" content="https://jayanthgopala.com/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jayanth Gopala V — Software Engineer" />
    <meta
      name="twitter:description"
      content="Building scalable software and exceptional digital experiences."
    />
    <meta name="twitter:image" content="https://jayanthgopala.com/og-image.jpg" />

    <link rel="canonical" href="https://jayanthgopala.com/" />

    <!--
      Two cuts of the same mark. The full JGV monogram is a high-contrast
      serif: at 16px its hairlines fall under one pixel and it reads as noise,
      so the tab size gets the J alone. Larger sizes get the whole lockup.
    -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="author" content="Jayanth Gopala V" />
    <!-- Helps a search engine associate the page with the person, alongside the
         JSON-LD Person schema injected by functions/_middleware.js -->
    <meta
      name="keywords"
      content="Jayanth Gopala, Jayanth Gopala V, software engineer, full stack developer, portfolio, India"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
